[pytest]
pythonpath = src

addopts =
    -v
    --strict-markers
    -ra
    --tb=short
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --video=retain-on-failure
    --output=test-results

markers =
    smoke: критичные тесты, гонять после каждого деплоя
    auth: тесты авторизации
    negative: Негативные сценарии (невалидные данные)
    storage: тесты работы с хранилищем
    tasks: Тесты связанные с задачами
    contracts: контрактные тесты
    db: тесты базы данных
    main_page: Тесты главной страницы
    catalog: Тесты каталога товаров
    admin: Тесты административной панели
    cart: Тесты корзины
    register: Тесты регистрации
    navigation: Тесты выпадающего меню
    javascript: Тесты выполнения JavaScript
    e2e: Тесты полного пользовательского сценария
    network: Тесты с моками
    hybrid: Тесты с гибридным форматом (UI+API)

