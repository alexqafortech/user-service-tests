name: Full CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Какие тесты запустить'
        required: true
        default: 'api'
        type: choice
        options:
          - api
          - ui
          - all

permissions:
  contents: write
  pull-requests: write
  
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:

  api-tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.test_suite == 'api' || inputs.test_suite == 'all'
    env:
      DB_PASSWORD: ${{secrets.DB_PASSWORD}}
      APP_SECRET_KEY: ${{secrets.APP_SECRET_KEY}}

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        
    steps:
      - name: Run info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
      
      - name: Checkout Tests repo
        uses: actions/checkout@v4
        with:
          path: tests-repo

      - name: Checkout Task Management API
        uses: actions/checkout@v4
        with:
          repository: balakleeva/task_management_api
          path: task-api

      - name: Start Task Management API
        working-directory: task-api
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$DB_PASSWORD|" .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$APP_SECRET_KEY|" .env
          docker compose up --build -d

      - name: Wait for API
        run: |
          echo "Ожидаем полной готовности API..."
          for i in $(seq 1 30); do
            # Проверяем, что API возвращает именно HTTP 200
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API успешно запущен и готов к работе!"
              exit 0
            fi
            echo "API ещё инициализируется (HTTP статус: $STATUS), ждём..."
            sleep 3
          done
          echo "API так и не ответил статусом 200 за отведенное время."
          echo "=== ЛОГИ КОНТЕЙНЕРОВ ==="
          cd task-api && docker compose logs
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          cache: "pip"
          cache-dependency-path: "tests-repo/requirements.txt"

      - name: Install dependencies
        working-directory: tests-repo
        run: pip install -r requirements.txt

      - name: Run API and DB tests
        working-directory: tests-repo
        run: pytest tests/api/ tests/db/ -v --alluredir=allure-results

      - name: Stop Task Management API
        if: always()
        working-directory: task-api
        run: docker compose down -v

      - name: Upload API results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api-${{matrix.python-version}}
          path: tests-repo/allure-results
  
  ui-tests:
    runs-on: ubuntu-latest
    env:
          BASE_URL: ${{secrets.BASE_URL}}
    
    if: github.event_name != 'workflow_dispatch' || inputs.test_suite == 'ui' || inputs.test_suite == 'all'
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependecies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Pull Selenoid browser images
        run: |
          docker pull selenoid/vnc_chrome:128.0
          docker pull selenoid/vnc_firefox:125.0
          docker pull selenoid/video-recorder:latest-release

      - name: Check Selenoid browser images
        run: docker images | grep selenoid

      - name: Start Selenoid
        run: docker compose -f docker-compose.selenoid.yml up -d

      - name: Wait for Selenoid
        run: |
          for i in $(seq 1 10); do
            if curl -s http://localhost:4444/status | grep -q '"total"'; then
              echo "Selenoid готов"; exit 0
            fi
            echo "Ждём Selenoid... ($i)"; sleep 3
          done
          echo "Selenoid не поднялся"; exit 1

      - name: Run UI tests
        run: pytest tests/ui/ --remote --selenoid-url http://localhost:4444/wd/hub --alluredir=allure-results -v

      - name: Upload UI results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ui
          path: allure-results

      - name: Upload videos on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: selenoid-videos
          path: video

      - name: Stop Selenoid
        if: always()
        run: docker compose -f docker-compose.selenoid.yml down

  report:
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()
    
    steps:
      - name: Donwload all results
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Merge results
        run: |
          mkdir -p allure-results

          for dir in all-results/allure-results-api-*; do
            if [ -d "$dir" ]; then
              cp -a "$dir"/. allure-results/
            fi
          done

          if [ -d all-results/allure-results-ui ]; then
            cp -a all-results/allure-results-ui/. allure-results/
          fi

          echo "Объединение результатов завершено."
          echo "Количество файлов:"
          find allure-results -type f | wc -l

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline
          allure --version

      - name: Load test report history
        uses: actions/checkout@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages


      - name: Restore Allure history
        if: always()
        run: |
          if [ -d gh-pages/history ]; then
            mkdir -p allure-results/history

            cp -a gh-pages/history/. \
              allure-results/history/

              echo "История Allure успешно восстановлена."

              if [ -f allure-results/history/history-trend.json ]; then
                jq 'length' allure-results/history/history-trend.json
              fi
          else
            echo "История предыдущего отчёта отсутствует."
          fi

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d allure-results ] && \
            find allure-results -type f \
            ! -path '*/history/*' -print -quit | grep -q .; then

            echo "Генерируем Allure HTML report..."

            allure generate allure-results \
              --clean \
              -o allure-report

            echo "Allure report успешно сгенерирован."

          else
            echo "Нет результатов тестирования для генерации Allure report."
          fi

      - name: Check Allure report
        if: always()
        run: |
          if [ -f allure-report/index.html ]; then
            echo "Allure index.html найден."
            echo "Содержимое папки allure-report:"
            find allure-report -maxdepth 2 -type f | head -50
          else
            echo "Allure index.html не найден. Публикация невозможна."
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && hashFiles('allure-report/index.html') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          keep_files: false

      - name: Comment PR with report link
        if: always() && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## Allure-отчет
            https://${{github.repository_owner}}.github.io/${{github.event.repository.name}}/
            Коммит: `${{github.sha}}`
          comment-tag: allure-report

      - name: Notify success
        if: always() && needs.api-tests.result == 'success' && needs.ui-tests.result == 'success'
        uses: appleboy/telegram-action@master
        with:
          to: ${{secrets.TELEGRAM_CHAT_ID}}
          token: ${{secrets.TELEGRAM_BOT_TOKEN}}
          format: html
          message: |
            Тесты прошли
            Статус: <b> ${{job.status}} </b>
            Ветка: <code> ${{github.ref_name}} </code>
            API: <b>${{needs.api-tests.result}}</b>
            UI: <b>${{needs.ui-tests.result}}</b>
            Ссылка на прого: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/">Allure-отчёт</a>

      - name: Notify failure
        if: always() && (needs.api-tests.result != 'success' || needs.ui-tests.result != 'success')
        uses: appleboy/telegram-action@master
        with:
          to: ${{secrets.TELEGRAM_CHAT_ID}}
          token: ${{secrets.TELEGRAM_BOT_TOKEN}}
          format: html
          message: |
            ТЕСТЫ УПАЛИ!
            Статус: <b> ${{job.status}} </b>
            Ветка: <code> ${{github.ref_name}} </code>
            Автор: <b> ${{github.actor}} </b>
            API: <b>${{needs.api-tests.result}}</b>
            UI: <b>${{needs.ui-tests.result}}</b>
            Ссылка на прого: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/">Allure-отчёт</a>
