name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Какие тесты запустить'
        required: true
        default: 'api'
        type: choice
        options:
          - api
          - ui
          - all

permissions:
  contents: write
  
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      DB_PASSWORD: ${{secrets.DB_PASSWORD}}
      APP_SECRET_KEY: ${{secrets.APP_SECRET_KEY}}

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        
    steps:
      - name: Run info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
      
      - name: Checkout Tests repo
        uses: actions/checkout@v4
        with:
          path: tests-repo

      - name: Checkout Task Management API
        uses: actions/checkout@v4
        with:
          repository: balakleeva/task_management_api
          path: task-api

      - name: Start Task Management API
        working-directory: task-api
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$DB_PASSWORD|" .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$APP_SECRET_KEY|" .env
          docker compose up --build -d

      - name: Wait for API
        run: |
          echo "Ожидаем полной готовности API..."
          for i in $(seq 1 30); do
            # Проверяем, что API возвращает именно HTTP 200
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API успешно запущен и готов к работе!"
              exit 0
            fi
            echo "API ещё инициализируется (HTTP статус: $STATUS), ждём..."
            sleep 3
          done
          echo "API так и не ответил статусом 200 за отведенное время."
          echo "=== ЛОГИ КОНТЕЙНЕРОВ ==="
          cd task-api && docker compose logs
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          cache: "pip"
          cache-dependency-path: "tests-repo/requirements.txt"

      - name: Install dependencies
        working-directory: tests-repo
        run: pip install -r requirements.txt

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline
          allure --version

      - name: Run API and DB tests
        if: github.event_name != 'workflow_dispatch' || inputs.test_suite == 'api' || inputs.test_suite == 'all' 
        working-directory: tests-repo
        run: pytest tests/api/ tests/db/ -v --alluredir=allure-results

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Load test report history
        uses: actions/checkout@v4
        if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.python-version == '3.12' }}
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Restore Allure history
        if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.python-version == '3.12' }}
        run: |
          mkdir -p tests-repo/allure-results

          if [ -d gh-pages/history ]; then
            mkdir -p tests-repo/allure-results/history
            cp -a gh-pages/history/. tests-repo/allure-results/history/
            echo "История Allure восстановлена."
          else
            echo "История предыдущего отчёта отсутствует."
          fi

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d tests-repo/allure-results ] && \
             find tests-repo/allure-results -type f \
             ! -path '*/history/*' -print -quit | grep -q .; then

            echo "Генерируем Allure HTML report..."

            allure generate tests-repo/allure-results \
              --clean \
              -o allure-report

            echo "Allure report успешно сгенерирован."
          else
            echo "Нет результатов тестирования для генерации Allure report."
          fi

      - name: Prepare Allure history
        if: ${{ always() && hashFiles('allure-report/index.html') != '' }}
        run: |
          if [ -d tests-repo/allure-results/history ]; then
            mkdir -p allure-report/history
            cp -a tests-repo/allure-results/history/. allure-report/history/
            echo "История отчёта подготовлена."
          else
            echo "История отсутствует. Это может быть первый запуск."
          fi

      - name: Check Allure report
        if: always()
        run: |
          if [ -f allure-report/index.html ]; then
            echo "Allure index.html найден."
            echo "Содержимое папки allure-report:"
            find allure-report -maxdepth 2 -type f | head -50
          else
            echo "Allure index.html не найден. Публикация невозможна."
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.python-version == '3.12' && hashFiles('allure-report/index.html') != '' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          keep_files: false

      - name: Stop Task Management API
        if: always()
        working-directory: task-api
        run: docker compose down -v
      
