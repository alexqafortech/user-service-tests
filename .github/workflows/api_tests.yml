name: API Tests

on:
  push:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ${{secrets.DB_PASSWORD}}
      APP_SECRET_KEY: ${{secrets.APP_SECRET_KEY}}
    steps:
      - name: Run info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
      
      - name: Checkout Tests repo
        uses: actions/checkout@v4
        with:
          path: tests-repo

      - name: Checkout Task Management API
        uses: actions/checkout@v4
        with:
          repository: balakleeva/task_management_api
          path: task-api

      - name: Start Task Management API
        working-directory: task-api
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$DB_PASSWORD|" .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$APP_SECRET_KEY|" .env
          docker compose up --build -d

      - name: Wait for API
        run: |
          echo "Ожидаем полной готовности API..."
          for i in $(seq 1 30); do
            # Проверяем, что API возвращает именно HTTP 200
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API успешно запущен и готов к работе!"
              exit 0
            fi
            echo "API ещё инициализируется (HTTP статус: $STATUS), ждём..."
            sleep 3
          done
          echo "API так и не ответил статусом 200 за отведенное время."
          echo "=== ЛОГИ КОНТЕЙНЕРОВ ==="
          cd task-api && docker compose logs
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: tests-repo
        run: pip install -r requirements.txt

      - name: Create env for tests
        working-directory: tests-repo
        run: |
          cp .env.example .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$DB_PASSWORD|" .env
          sed -i "s|^DB_PORT=.*|DB_PORT=5433|" .env

      - name: Run tests
        working-directory: tests-repo
        run: pytest tests/api/ tests/db/ -v
        
